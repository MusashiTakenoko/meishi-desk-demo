<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meishi Desk | 名刺管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0c2454; --navy2:#16357a; --cyan:#19b5dc; --teal:#10b3a3; --mint:#dcf5f1;
  --sky:#dbeafb; --bg:#f2f6fb; --card:#fff; --line:#e2e8f1; --text:#0f1f3d; --sub:#66748c;
  --danger:#e5484d; --star:#f5a524; --radius:14px;
  --shadow:0 1px 2px rgba(12,36,84,.06),0 6px 20px rgba(12,36,84,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;color:var(--text);background:var(--bg);
  display:grid;grid-template-columns:248px 1fr;min-width:1080px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font:inherit;color:inherit}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- sidebar ---------- */
.side{background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:22px 14px 16px;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px;font-weight:900;font-size:19px;letter-spacing:.02em}
.brand .mark{display:flex;gap:2px;transform:skewX(-22deg)}
.brand .mark i{display:block;width:9px;height:20px;border-radius:2px;background:var(--cyan)}
.brand .mark i+i{background:#7fe3e0;margin-top:5px}
.nav-label{font-size:11px;letter-spacing:.12em;color:#8fa3cc;padding:14px 10px 6px}
.nav button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#c9d5ee;font-size:14px;font-weight:500;text-align:left;transition:.15s}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.on{background:rgba(25,181,220,.18);color:#fff}
.nav button.on svg{color:var(--cyan)}
.nav .cnt{margin-left:auto;font-size:12px;color:#8fa3cc;font-weight:500}
.nav .dot{width:8px;height:8px;border-radius:50%;margin:0 5px;flex:none}
.tags-nav{overflow:auto;flex:1;min-height:0}
.side-foot{border-top:1px solid rgba(255,255,255,.1);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.side-foot button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:#a9b9da;font-size:13px}
.side-foot button:hover{background:rgba(255,255,255,.07);color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;font-size:13px}
.me .av{width:32px;height:32px;border-radius:50%;background:var(--cyan);display:grid;place-items:center;font-weight:700}
.me small{display:block;color:#8fa3cc;font-size:11px}

/* ---------- main ---------- */
.main{height:100vh;overflow:auto;padding:22px 30px 40px;transition:padding-right .28s cubic-bezier(.2,.8,.2,1)}
body.detail-open .main{padding-right:440px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.top h1{font-size:22px;font-weight:900;margin-right:auto}
.top h1 small{font-size:13px;color:var(--sub);font-weight:500;margin-left:10px}
.search{position:relative;width:320px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--sub)}
.search input{width:100%;height:42px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 40px 0 38px;outline:none;font-size:14px;transition:.15s}
.search input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(25,181,220,.18)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:inherit;font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--bg)}
.btn{height:42px;padding:0 18px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn.primary{background:var(--navy);color:#fff;box-shadow:0 4px 14px rgba(12,36,84,.25)}
.btn.primary:hover{background:var(--navy2);transform:translateY(-1px)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:#fff;border:1px solid var(--line)}
.btn.ghost:hover{border-color:#b9c6da;background:#f8fafd}
.btn.danger{background:var(--danger);color:#fff}
.btn.big{height:54px;font-size:17px;border-radius:14px;width:100%;justify-content:center}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat{background:#fff;border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px}
.stat .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--sky);color:#1668c7}
.stat:nth-child(2) .ico{background:var(--mint);color:var(--teal)}
.stat:nth-child(3) .ico{background:#ece9ff;color:#5b4bd6}
.stat:nth-child(4) .ico{background:#fff1d6;color:#c77d00}
.stat b{display:block;font-size:24px;font-weight:900;line-height:1.1}
.stat span{font-size:12px;color:var(--sub)}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.toolbar .info{font-size:13px;color:var(--sub);margin-right:auto}
.toolbar .info b{color:var(--text)}
.toolbar select{height:36px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 10px;font-size:13px;outline:none}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{width:34px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--sub)}
.seg button.on{background:var(--navy);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.item{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:.18s;position:relative;border:2px solid transparent}
.item:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(12,36,84,.06),0 14px 32px rgba(12,36,84,.12)}
.item.sel{border-color:var(--cyan)}
.item .pv{background:var(--sky);padding:16px 18px}
.item .meta{padding:12px 14px 14px}
.item .nm{font-weight:700;font-size:15px}
.item .co{font-size:12px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .starbtn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:#a9b4c6;opacity:0;transition:.15s}
.item:hover .starbtn,.item .starbtn.on{opacity:1}
.starbtn.on{color:var(--star)} .starbtn.on svg{fill:var(--star)}
.item.new{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:none;opacity:1}}
.boot .item{animation:rise .45s both cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11px;font-weight:500;padding:2px 9px;border-radius:99px;background:#eef2f8;color:#42526e;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.chip button{display:grid;place-items:center;opacity:.6}.chip button:hover{opacity:1}
.chip svg{width:11px;height:11px}

table.list{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;font-size:13px}
.list th{text-align:left;font-size:11px;color:var(--sub);font-weight:500;padding:11px 14px;background:#f8fafd;border-bottom:1px solid var(--line)}
.list td{padding:10px 14px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.list tr{cursor:pointer}.list tbody tr:hover{background:#f6faff}.list tr.sel{background:#eaf7fc}
.list .who{display:flex;align-items:center;gap:10px;font-weight:700}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.empty{text-align:center;padding:70px 0;color:var(--sub)}
.empty .big{font-size:44px;margin-bottom:8px}

/* ---------- business card visual ---------- */
.bc{position:relative;container-type:inline-size;aspect-ratio:91/55;background:#fff;border-radius:5px;overflow:hidden;box-shadow:0 2px 10px rgba(12,36,84,.16);color:#111;--c1:#0a56b0;--c2:#a9e6ea}
.bc>*{position:absolute}
.bc-top{left:8cqw;top:8cqw;display:flex;align-items:center;gap:2.6cqw;max-width:84cqw}
.bc-logo{display:flex;gap:.8cqw;transform:skewX(-24deg)}
.bc-logo i{display:block;width:3.4cqw;height:5.6cqw;background:var(--c1)}
.bc-logo i+i{background:var(--c2);filter:saturate(1.6) brightness(.82);margin-top:1.6cqw}
.bc-sep{position:static;width:1px;height:6.5cqw;background:#555}
.bc-co{font-size:4.5cqw;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-dept{left:8cqw;top:22.5cqw;font-size:3.3cqw;white-space:nowrap}
.bc-name{left:8cqw;top:27.5cqw;font-size:8.2cqw;font-weight:900;letter-spacing:.06em;white-space:nowrap}
.bc-line{left:8cqw;top:43.6cqw;width:60cqw;height:1px;background:var(--c1);opacity:.7}
.bc-mail{left:8cqw;top:47.3cqw;font-size:3.3cqw;display:flex;align-items:center;gap:1.8cqw;white-space:nowrap}
.bc-mail svg{width:4cqw;height:4cqw;stroke-width:1.6}
.bc-t1,.bc-t2{right:0;bottom:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.bc-t1{width:24cqw;height:38cqw;background:var(--c2)}
.bc-t2{width:16cqw;height:21cqw;background:var(--c1)}
.bc.photo{background:#111}.bc.photo img{inset:0;width:100%;height:100%;object-fit:cover}

/* ---------- detail panel ---------- */
.detail{position:fixed;top:0;right:0;width:420px;height:100vh;background:#fff;box-shadow:-10px 0 40px rgba(12,36,84,.12);transform:translateX(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:20}
body.detail-open .detail{transform:none}
.d-head{display:flex;align-items:center;gap:6px;padding:14px 16px;border-bottom:1px solid var(--line)}
.d-head b{margin-right:auto;font-size:15px}
.icb{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--sub);transition:.15s}
.icb:hover{background:var(--bg);color:var(--text)}
.icb.del:hover{background:#fdecec;color:var(--danger)}
.d-body{overflow:auto;padding:18px 20px 30px;flex:1}
.d-pv{background:var(--sky);border-radius:14px;padding:22px 26px;margin-bottom:16px}
.d-quick{display:flex;gap:8px;margin-bottom:10px}
.d-quick .btn{flex:1;justify-content:center;height:38px;font-size:13px;padding:0 8px}
.frow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);min-height:50px}
.frow label{width:78px;font-size:13px;color:var(--sub);flex:none}
.frow input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:16px;font-weight:500;padding:8px 8px;border-radius:8px;text-overflow:ellipsis}
.frow input:read-only{cursor:default}
.frow input:not(:read-only){background:#f1f8fd;box-shadow:0 0 0 2px var(--cyan)}
.frow .pen{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:#55637b}
.frow .pen:hover{background:var(--bg);color:var(--navy)}
.sec{font-size:12px;color:var(--sub);font-weight:700;margin:20px 0 8px;letter-spacing:.06em}
.d-body textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none;resize:vertical;font-size:14px;line-height:1.7}
.d-body textarea:focus,.taginput:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(25,181,220,.18)}
.taginput{height:30px;border:1px dashed #b9c6da;border-radius:99px;padding:0 12px;font-size:12px;outline:none;width:120px}
.chips.lg .chip{font-size:12px;padding:4px 11px}
.d-foot{font-size:11px;color:var(--sub);margin-top:18px}

/* ---------- modal / scan flow ---------- */
.ov{position:fixed;inset:0;background:rgba(9,22,52,.5);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50}
.ov.show{display:grid;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:22px;width:min(980px,94vw);max-height:94vh;overflow:auto;box-shadow:0 30px 80px rgba(9,22,52,.35);animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(24px) scale(.98);opacity:0}}
.m-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:18px 20px 6px}
.m-head h2{text-align:center;font-size:20px;font-weight:900}
.steps{display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 0 18px;font-size:14px;color:var(--sub);font-weight:500}
.steps .s{display:flex;align-items:center;gap:8px}
.steps .n{width:26px;height:26px;border-radius:50%;background:#e4eaf3;color:#7b88a0;display:grid;place-items:center;font-size:13px;font-weight:700}
.steps .n svg{width:14px;height:14px;stroke-width:2.6}
.steps .s.on{color:var(--cyan);font-weight:700}.steps .s.on .n{background:var(--cyan);color:#fff}
.steps .bar{width:64px;height:2px;background:#dfe6f0;border-radius:2px}
.m-body{padding:0 26px 26px}

.drop{border:2px dashed #b7c9e2;border-radius:18px;background:#f5f9fe;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;transition:.15s;position:relative;overflow:hidden}
.drop.over{border-color:var(--cyan);background:#e6f6fc}
.drop .bigico{width:74px;height:74px;border-radius:50%;background:var(--sky);display:grid;place-items:center;color:#1668c7;margin-bottom:6px}
.drop .bigico svg{width:34px;height:34px}
.drop h3{font-size:18px}.drop p{font-size:13px;color:var(--sub)}
.drop .row{display:flex;gap:10px;margin-top:14px}
.drop video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.cam-ui{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:18px;pointer-events:none}
.cam-ui>*{pointer-events:auto}
.cam-frame{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:56%;aspect-ratio:91/55;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.35)}
.shutter{width:62px;height:62px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.5);background-clip:padding-box}

.confirm{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.pvbox{background:var(--sky);border-radius:16px;padding:30px 34px 22px;position:relative}
.pvbox .wrap{position:relative}
.scanfx{position:absolute;inset:0;border-radius:5px;overflow:hidden;pointer-events:none}
.scanfx::before{content:"";position:absolute;left:0;right:0;height:38%;top:-40%;background:linear-gradient(180deg,transparent,rgba(25,181,220,.35));border-bottom:2px solid var(--cyan);box-shadow:0 6px 18px rgba(25,181,220,.7);animation:scan 1.1s ease-in-out infinite alternate}
@keyframes scan{to{top:64%}}
.scanfx::after{content:"";position:absolute;inset:0;border:2px solid var(--cyan);border-radius:5px;animation:blink .8s infinite alternate}
@keyframes blink{to{opacity:.25}}
.retake{margin:16px auto 0;display:flex}
.banner{margin-top:14px;border-radius:12px;padding:13px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:16px;background:#eef2f8;color:var(--sub)}
.banner.ok{background:var(--mint);color:var(--teal);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.banner .ck{width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center}
.banner .ck svg{width:15px;height:15px;stroke-width:3}
.spin{width:20px;height:20px;border:3px solid #c9d4e4;border-top-color:var(--cyan);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.note{font-size:11px;color:var(--sub);margin-top:8px;text-align:center}
.tagbox{border:1px solid var(--line);border-radius:12px;margin:16px 0}
.tagbox .th{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:700;font-size:14px;text-align:left}
.tagbox .plus{width:26px;height:26px;border-radius:50%;background:#d8f1fa;color:var(--cyan);display:grid;place-items:center;flex:none}
.tagbox .th .chips{margin:0;flex:1}
.tagbox .chev{margin-left:auto;transition:.2s;color:#55637b}
.tagbox.open .chev{transform:rotate(180deg)}
.tagbox .tb{display:none;padding:0 14px 14px}
.tagbox.open .tb{display:block}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sugg button{font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid var(--line);color:#42526e}
.sugg button:hover{border-color:var(--cyan);color:var(--cyan)}
.sugg button.on{background:var(--cyan);border-color:var(--cyan);color:#fff}

.done{text-align:center;padding:10px 0 6px}
.done .ring{width:92px;height:92px;border-radius:50%;background:var(--mint);display:grid;place-items:center;margin:0 auto 16px;animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
.done .ring div{width:62px;height:62px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center}
.done .ring svg{width:34px;height:34px;stroke-width:3;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .25s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done h3{font-size:22px;font-weight:900}.done p{color:var(--sub);font-size:14px;margin-top:6px}
.done .mini{width:300px;margin:22px auto}
.done .row{display:flex;gap:12px;justify-content:center}

.dialog{background:#fff;border-radius:18px;width:400px;padding:26px;box-shadow:0 30px 80px rgba(9,22,52,.35);animation:up .25s}
.dialog h3{font-size:17px;margin-bottom:8px}.dialog p{font-size:14px;color:var(--sub);line-height:1.7}
.dialog .row{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,80px);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(9,22,52,.35);transition:.3s cubic-bezier(.2,.9,.3,1);z-index:99;opacity:0}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast button{color:#7fe3f5;font-weight:700}
</style>
</head>
<body class="boot">

<aside class="side">
  <div class="brand"><span class="mark"><i></i><i></i></span>Meishi Desk</div>
  <nav class="nav" id="nav"></nav>
  <div class="nav-label">タグ</div>
  <nav class="nav tags-nav" id="tagnav"></nav>
  <div class="side-foot">
    <button data-act="csv"><svg class="ic"><use href="#i-download"/></svg>CSVエクスポート</button>
    <button data-act="reset"><svg class="ic"><use href="#i-refresh"/></svg>デモデータをリセット</button>
    <div class="me"><div class="av">D</div><div>デモユーザー<small>営業部 / Demo</small></div></div>
  </div>
</aside>

<main class="main" id="main">
  <div class="top">
    <h1 id="title"></h1>
    <div class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q" placeholder="氏名・会社名・タグで検索" autocomplete="off"><kbd>/</kbd></div>
    <button class="btn primary" data-act="scan"><svg class="ic"><use href="#i-camera"/></svg>名刺をスキャン</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <div class="info" id="info"></div>
    <select id="sort">
      <option value="new">登録が新しい順</option>
      <option value="name">氏名（五十音順）</option>
      <option value="co">会社名順</option>
    </select>
    <div class="seg">
      <button data-act="view" data-v="grid" title="カード表示"><svg class="ic"><use href="#i-grid"/></svg></button>
      <button data-act="view" data-v="list" title="リスト表示"><svg class="ic"><use href="#i-list"/></svg></button>
    </div>
  </div>
  <div id="content"></div>
</main>

<aside class="detail" id="detail"></aside>
<div class="ov" id="ov"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<svg style="display:none">
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>

  if (c.img) return `<div class="bc photo"><img src="${c.img}" alt=""></div>`;
  const t = THEMES[c.theme % THEMES.length];
  return `<div class="bc" style="--c1:${t[0]};--c2:${t[1]}">

}

function filtered(){
  const q = ui.q.trim().toLowerCase(), now = Date.now();
  let a = cards.filter(c => {
    if (ui.nav==='fav' && !c.fav) return false;
    if (ui.nav==='recent' && now - c.createdAt > 7*DAY) return false;
    if (ui.nav.startsWith('tag:') && !c.tags.includes(ui.nav.slice(4))) return false;
    if (!q) return true;
    return [c.name,c.kana,c.company,c.dept,c.title,c.email,c.tel,...c.tags].join(' ').toLowerCase().includes(q);
  });
  if (ui.sort==='new') a.sort((x,y) => y.createdAt - x.createdAt);
  if (ui.sort==='name') a.sort((x,y) => (x.kana||x.name).localeCompare(y.kana||y.name,'ja'));
  if (ui.sort==='co') a.sort((x,y) => x.company.replace(/株式会社/g,'').localeCompare(y.company.replace(/株式会社/g,''),'ja'));
  return a;
}

    </div>`).join('')}</div>`;
  else h = `<table class="list"><thead><tr><th>氏名</th><th>会社名</th><th>部署・役職</th><th>メール</th><th>タグ</th><th>登録日</th><th></th></tr></thead><tbody>${list.map(c => `
    <tr class="${c.id===ui.sel?'sel':''}" data-act="open" data-id="${c.id}">
      <td><div class="who"><span class="av" style="background:${THEMES[c.theme%THEMES.length][0]}">${esc(c.name[0]||'?')}</span>${esc(c.name)}</div></td>

    </tr>`).join('')}</tbody></table>`;

  const t = $('#toast'); t.innerHTML = `<span>${esc(msg)}</span>${label?`<button>${label}</button>`:''}`;
  if (label) t.querySelector('button').onclick = () => { fn(); t.classList.remove('show'); };
  t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), label?6000:2400);
}
function dialog(title, msg, ok, fn, danger){
  $('#ov').innerHTML = `<div class="dialog"><h3>${esc(title)}</h3><p>${esc(msg)}</p><div class="row"><button class="btn ghost" data-act="ov-close">キャンセル</button><button class="btn ${danger?'danger':'primary'}" id="dlg-ok">${esc(ok)}</button></div></div>`;
  $('#ov').classList.add('show'); $('#dlg-ok').onclick = () => { closeOv(); fn(); }; $('#dlg-ok').focus();
}

    </div>`;
  else if (scan.step===2) body = `
    <div class="confirm">
      <div>
        <div class="pvbox"><div class="wrap">${bc(scan.img?{img:scan.img}:scan.data)}<div class="scanfx" id="scanfx"></div></div>
          <button class="btn ghost retake" data-act="retake">${ic('refresh')}撮り直す</button></div>
        <div class="banner" id="banner"><span class="spin"></span>AIが名刺を読み取っています…</div>
        ${scan.img?'<div class="note">※ デモ版のため、読み取り結果にはサンプルデータを表示しています</div>':''}
      </div>
      <div>
        ${[['name','氏名'],['company','会社名'],['dept','部署'],['title','役職'],['email','メール'],['tel','電話']].map(f => frow(f[0], f[1], '', 'data-sf')).join('')}
        <div class="tagbox" id="tagbox"></div>
        <button class="btn primary big" id="savebtn" data-act="save" disabled>${ic('download')}名刺を保存</button>
      </div>
    </div>`;
  else body = `
    <div class="done">
      <div class="ring"><div>${ic('check')}</div></div>
      <h3>名刺を保存しました</h3><p>${esc(scan.saved.name)} さん（${esc(scan.saved.company)}）を登録しました</p>
      <div class="mini">${bc(scan.saved)}</div>
      <div class="row"><button class="btn ghost" data-act="again">${ic('camera')}続けてスキャン</button><button class="btn primary" data-act="view-saved">一覧で確認する</button></div>
    </div>`;
  $('#ov').innerHTML = `<div class="modal">
    <div class="m-head">${scan.step===2?`<button class="icb" data-act="retake" title="戻る">${ic('back')}</button>`:'<span></span>'}<h2>${titles[scan.step-1]}</h2><button class="icb" data-act="ov-close" title="閉じる">${ic('x')}</button></div>
    ${stepper(scan.step)}<div class="m-body">${body}</div></div>`;
  $('#ov').classList.add('show');
  if (scan.step===1) bindDrop();
  if (scan.step===2) renderTagbox();
}
function renderTagbox(){
  const box = $('#tagbox'); if (!box) return;
  box.classList.toggle('open', !!scan.tagOpen);
  box.innerHTML = `<button class="th" data-act="tag-toggle"><span class="plus">${ic('plus')}</span>${scan.tags.length?`<span class="chips">${chips(scan.tags)}</span>`:'タグを追加'}<span class="chev">${ic('chev')}</span></button>
    <div class="tb"><input class="taginput" id="stagin" style="width:100%;border-radius:10px;height:38px;font-size:14px" placeholder="タグ名を入力して Enter">
    <div class="sugg">${Object.keys(allTags()).map(t => `<button data-act="stag" data-t="${esc(t)}" class="${scan.tags.includes(t)?'on':''}">${esc(t)}</button>`).join('')}</div></div>`;
}
function openScan(){ scan = {step:1}; renderScan(); }
async function startRead(img){
  stopCam();
  const my = ++tok;
  const s = SAMPLES[ui.sampleIdx % SAMPLES.length]; ui.sampleIdx++; save();
  scan = {step:2, img:img||null, data:{...s}, tags:[], tagOpen:false, done:false};
  renderScan();
  await sleep(1900); if (my!==tok) return;
  $('#scanfx')?.remove();
  const b = $('#banner'); b.className = 'banner ok'; b.innerHTML = `<span class="ck">${ic('check')}</span>名刺を読み取りました`;
  for (const inp of document.querySelectorAll('[data-sf]')) {
    const v = scan.data[inp.dataset.sf] || '';
    for (let i=1; i<=v.length; i++) { if (my!==tok) return; inp.value = v.slice(0,i); await sleep(v.length>16?9:22); }
  }
  if (my!==tok) return;
  scan.done = true; $('#savebtn').disabled = false; $('#savebtn').focus();
}
function saveScan(){
  const d = {...scan.data};
  document.querySelectorAll('[data-sf]').forEach(i => d[i.dataset.sf] = i.value.trim());
  if (!d.name && !d.company) { toast('氏名または会社名を入力してください'); return; }
  const c = {id:uid(), name:d.name, kana:d.kana||'', company:d.company, dept:d.dept, title:d.title, email:d.email, tel:d.tel,
    tags:[...scan.tags], theme:d.theme ?? cards.length%THEMES.length, createdAt:Date.now(), fav:false, memo:'', img:scan.img};
  cards.unshift(c); save(); newId = c.id;
  if (memOnly && c.img) { /* 画像が大きく保存できない場合は画像なしで再保存 */ }
  scan = {step:3, saved:c}; tok++;
  render(); renderScan();
}
function bindDrop(){
  const d = $('#drop');
  ['dragenter','dragover'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.add('over'); }));
  ['dragleave','drop'].forEach(e => d.addEventListener(e, ev => { ev.preventDefault(); d.classList.remove('over'); }));
  d.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) readFile(f); });
}
function readFile(f){
  if (!f.type.startsWith('image/')) { toast('画像ファイルを選択してください'); return; }
  const r = new FileReader();
  r.onload = () => { const im = new Image(); im.onload = () => startRead(shrink(im, im.width, im.height)); im.src = r.result; };
  r.readAsDataURL(f);
}
function shrink(src, w, h){
  // 名刺の縦横比(91:55)で中央を切り出し、640px幅に縮小
  const ar = 91/55; let sw = w, sh = w/ar; if (sh > h) { sh = h; sw = h*ar; }
  const cv = document.createElement('canvas'); cv.width = 640; cv.height = Math.round(640/ar);
  cv.getContext('2d').drawImage(src, (w-sw)/2, (h-sh)/2, sw, sh, 0, 0, cv.width, cv.height);
  return cv.toDataURL('image/jpeg', .8);
}
async function startCam(){
  try {
    camStream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280}, height:{ideal:720}}});
    if (!scan || scan.step!==1) return stopCam();
    $('#drop').innerHTML = `<video id="vid" autoplay playsinline muted></video><div class="cam-frame"></div>
      <div class="cam-ui"><button class="btn ghost" data-act="cam-cancel">キャンセル</button><button class="shutter" data-act="shoot" title="撮影"></button><span style="width:108px"></span></div>`;
    $('#vid').srcObject = camStream;
  } catch(e) { toast('カメラを利用できません。「サンプル名刺で試す」をご利用ください'); }
}
function stopCam(){ if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function shoot(){
  const v = $('#vid'); if (!v || !v.videoWidth) return;
  // 画面上のガイド枠(幅56%)に相当する範囲を切り出す
  const cv = document.createElement('canvas'); cv.width = v.videoWidth; cv.height = v.videoHeight; cv.getContext('2d').drawImage(v,0,0);
  const cw = v.videoWidth*.62, ch = cw*55/91, tmp = document.createElement('canvas'); tmp.width = cw; tmp.height = ch;
  tmp.getContext('2d').drawImage(cv, (v.videoWidth-cw)/2, v.videoHeight*.46-ch/2, cw, ch, 0, 0, cw, ch);
  startRead(shrink(tmp, cw, ch));
}

/* ---------- actions ---------- */
const cur = () => cards.find(c => c.id===ui.sel);
function addTag(arr, t){ t = t.trim(); if (t && !arr.includes(t)) arr.push(t); }
function exportCsv(){
  const rows = [['氏名','ふりがな','会社名','部署','役職','メール','電話','タグ','メモ','登録日'], ...cards.map(c => [c.name,c.kana,c.company,c.dept,c.title,c.email,c.tel,c.tags.join(' / '),c.memo,fmt(c.createdAt)])];
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download = `名刺一覧_${fmt(Date.now()).replace(/\//g,'')}.csv`; a.click();
  toast(`${cards.length} 件をCSVに書き出しました`);
}

document.addEventListener('click', e => {
  if (e.target.id==='ov' && $('#ov .dialog, #ov .modal')) { if (!scan || scan.step!==2) closeOv(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'nav': ui.nav = el.dataset.n; render(); break;
    case 'view': ui.view = el.dataset.v; save(); render(); break;
    case 'open': ui.sel = id; render(); renderDetail(); break;
    case 'close': ui.sel = null; render(); renderDetail(); break;
    case 'fav': { e.stopPropagation(); const c = cards.find(x => x.id===id); c.fav = !c.fav; save(); render(); renderDetail(); break; }
    case 'pen': { const i = el.parentElement.querySelector('input'); i.readOnly = false; i.focus(); i.select(); break; }
    case 'del': { const c = cur(); dialog('名刺を削除しますか？', `${c.name} さん（${c.company}）の名刺を削除します。`, '削除する', () => {
        const idx = cards.indexOf(c); cards.splice(idx,1); ui.sel = null; save(); render(); renderDetail();
        toast('名刺を削除しました', '元に戻す', () => { cards.splice(idx,0,c); save(); render(); });
      }, true); break; }
    case 'copy': { const c = cur(); navigator.clipboard?.writeText(c.email).then(() => toast('メールアドレスをコピーしました'), () => toast(c.email)); break; }
    case 'mailto': location.href = 'mailto:' + cur().email; break;
    case 'dtag-rm': { const c = cur(); c.tags = c.tags.filter(t => t!==el.dataset.t); save(); render(); renderDetail(); break; }
    case 'csv': exportCsv(); break;
    case 'reset': dialog('デモデータをリセットしますか？', '追加・編集・削除した内容をすべて破棄し、初期のサンプルデータに戻します。', 'リセットする', () => {
        cards = seed(); ui.sel = null; ui.nav = 'all'; ui.sampleIdx = 0; save(); document.body.classList.add('boot'); render(); renderDetail(); toast('初期データに戻しました'); }); break;
    case 'scan': case 'again': openScan(); break;
    case 'ov-close': closeOv(); break;
    case 'sample': startRead(null); break;
    case 'pick': $('#file').click(); break;
    case 'cam': startCam(); break;
    case 'cam-cancel': stopCam(); renderScan(); break;
    case 'shoot': shoot(); break;
    case 'retake': tok++; scan = {step:1}; renderScan(); break;
    case 'tag-toggle': scan.tagOpen = !scan.tagOpen; renderTagbox(); if (scan.tagOpen) $('#stagin').focus(); break;
    case 'stag': { const t = el.dataset.t; scan.tags.includes(t) ? scan.tags = scan.tags.filter(x => x!==t) : scan.tags.push(t); renderTagbox(); break; }
    case 'save': saveScan(); break;
    case 'view-saved': { const sid = scan.saved.id; closeOv(); ui.nav = 'all'; ui.q = ''; $('#q').value = ''; ui.sort = 'new'; ui.sel = sid; newId = sid; render(); renderDetail(); $('#main').scrollTo({top:0, behavior:'smooth'}); break; }
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.id==='sort') { ui.sort = t.value; save(); render(); }
  if (t.id==='file') { if (t.files[0]) readFile(t.files[0]); t.value = ''; }
  if (t.dataset.f) { const c = cur(); c[t.dataset.f] = t.value.trim(); save(); render(); $('#dpv').innerHTML = bc(c); toast('保存しました'); }
  if (t.id==='memo') { cur().memo = t.value; save(); toast('メモを保存しました'); }
});
document.addEventListener('focusout', e => { if (e.target.matches('.frow input')) e.target.readOnly = true; });
document.addEventListener('input', e => { if (e.target.id==='q') { ui.q = e.target.value; render(); } });
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.isComposing) return;
  if (e.key==='Enter' && t.matches('.frow input')) t.blur();
  if (e.key==='Enter' && t.id==='dtagin' && t.value.trim()) { addTag(cur().tags, t.value); save(); render(); renderDetail(); $('#dtagin').focus(); }
  if (e.key==='Enter' && t.id==='stagin' && t.value.trim()) { addTag(scan.tags, t.value); renderTagbox(); $('#stagin').focus(); }
  if (e.key==='Escape') { if ($('#ov').classList.contains('show')) closeOv(); else if (ui.sel) { ui.sel = null; render(); renderDetail(); } }
  if (e.key==='/' && !t.matches('input,textarea')) { e.preventDefault(); $('#q').focus(); }
});

load(); render(); renderDetail();
setTimeout(() => document.body.classList.remove('boot'), 1200);
})();
</script>
</body>
